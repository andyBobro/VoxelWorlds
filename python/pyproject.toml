[project]
name = "voxelworlds"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "osmnx>=2.0", "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "numpy>=1.26",
  "requests>=2.31", "pillow>=10.0", "mapbox-vector-tile>=2.0", "osmium>=4.3,<5",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voxelworlds", "voxelworlds.osm", "voxelworlds.mapillary", "voxelworlds.voxel", "voxelworlds.export", "voxelworlds.cv"]
